<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="hud">Use W/S para acelerar e frear, A/D para virar</div>

    <a-scene background="color: #87ceeb">
      <a-assets>
        <img
          id="groundTexture"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 256 256'><rect width='256' height='256' fill='%23323232'/><g opacity='0.18'><circle cx='20' cy='28' r='2' fill='%23525252'/><circle cx='64' cy='52' r='2' fill='%235b5b5b'/><circle cx='108' cy='24' r='2' fill='%23585858'/><circle cx='160' cy='60' r='2' fill='%23565656'/><circle cx='210' cy='34' r='2' fill='%235d5d5d'/><circle cx='34' cy='112' r='2' fill='%23585858'/><circle cx='86' cy='140' r='2' fill='%23535353'/><circle cx='138' cy='116' r='2' fill='%235c5c5c'/><circle cx='196' cy='146' r='2' fill='%23575757'/><circle cx='228' cy='120' r='2' fill='%235d5d5d'/><circle cx='22' cy='204' r='2' fill='%235a5a5a'/><circle cx='76' cy='222' r='2' fill='%23585858'/><circle cx='128' cy='196' r='2' fill='%23505050'/><circle cx='184' cy='228' r='2' fill='%235d5d5d'/><circle cx='230' cy='202' r='2' fill='%23565656'/></g><rect x='120' y='0' width='16' height='52' fill='%23f2e37a'/><rect x='120' y='76' width='16' height='52' fill='%23f2e37a'/><rect x='120' y='152' width='16' height='52' fill='%23f2e37a'/><rect x='120' y='228' width='16' height='28' fill='%23f2e37a'/></svg>"
          crossorigin="anonymous"
        />
        <img
          id="wheelTexture"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'><rect width='128' height='128' fill='%23090909'/><g stroke='%235f5f5f' stroke-width='6' opacity='0.9'><path d='M10 0 L34 128'/><path d='M42 0 L66 128'/><path d='M74 0 L98 128'/><path d='M106 0 L130 128'/></g><g stroke='%23242424' stroke-width='10' opacity='0.95'><path d='M-6 12 L18 140'/><path d='M26 -12 L50 116'/><path d='M58 12 L82 140'/><path d='M90 -12 L114 116'/><path d='M122 12 L146 140'/></g><g opacity='0.25'><circle cx='20' cy='20' r='2' fill='%23707070'/><circle cx='54' cy='30' r='2' fill='%23606060'/><circle cx='88' cy='22' r='2' fill='%23787878'/><circle cx='110' cy='40' r='2' fill='%23666666'/><circle cx='28' cy='82' r='2' fill='%23757575'/><circle cx='64' cy='96' r='2' fill='%23626262'/><circle cx='98' cy='78' r='2' fill='%23727272'/><circle cx='116' cy='108' r='2' fill='%23686868'/></g></svg>"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-entity id="cameraRig" position="0 6 -5">
        <a-camera
          id="camera"
          position="0 0 -5"
          rotation="-12 180 0"
          look-controls="enabled: false"
          wasd-controls="enabled: false"
        ></a-camera>
      </a-entity>

      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="5 10 5"></a-light>

      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="500"
        height="200"
        src="#groundTexture"
        repeat="18 8"
      ></a-plane>

      <a-entity id="carro" position="0 0 -5">
        <a-entity id="carroVisual" position="0 1.3 0">
          <a-box width="1" height="0.5" depth="2" color="red"></a-box>
          <a-box position="0 0.45 -0.45" width="0.9" height="0.45" depth="0.9" color="#cc2222"></a-box>
          <a-box position="-0.28 0.12 -1.02" width="0.16" height="0.08" depth="0.08" color="#b22222"></a-box>
          <a-box position="0.28 0.12 -1.02" width="0.16" height="0.08" depth="0.08" color="#b22222"></a-box>
          <a-light type="point" color="#ff3b30" intensity="0.55" distance="6" decay="2" position="-0.28 0.12 -1.18"></a-light>
          <a-light type="point" color="#ff3b30" intensity="0.55" distance="6" decay="2" position="0.28 0.12 -1.18"></a-light>
          <a-box position="-0.28 0.12 1.02" width="0.12" height="0.08" depth="0.08" color="#ffe08a"></a-box>
          <a-box position="0.28 0.12 1.02" width="0.12" height="0.08" depth="0.08" color="#ffe08a"></a-box>
          <a-light type="point" color="#ffffff" intensity="0.9" distance="10" decay="2" position="-0.28 0.12 1.18"></a-light>
          <a-light type="point" color="#ffffff" intensity="0.9" distance="10" decay="2" position="0.28 0.12 1.18"></a-light>

          <a-entity position="-0.6 -0.2 0.8">
            <a-entity class="roda">
              <a-cylinder radius="0.3" height="0.3" rotation="0 0 90" src="#wheelTexture"></a-cylinder>
            </a-entity>
          </a-entity>
          <a-entity position="0.6 -0.2 0.8">
            <a-entity class="roda">
              <a-cylinder radius="0.3" height="0.3" rotation="0 0 90" src="#wheelTexture"></a-cylinder>
            </a-entity>
          </a-entity>
          <a-entity position="-0.6 -0.2 -0.8">
            <a-entity class="roda">
              <a-cylinder radius="0.3" height="0.3" rotation="0 0 90" src="#wheelTexture"></a-cylinder>
            </a-entity>
          </a-entity>
          <a-entity position="0.6 -0.2 -0.8">
            <a-entity class="roda">
              <a-cylinder radius="0.3" height="0.3" rotation="0 0 90" src="#wheelTexture"></a-cylinder>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      window.addEventListener('load', function () {
        const carro = document.querySelector('#carro');
        const cameraRig = document.querySelector('#cameraRig');
        const rodas = document.querySelectorAll('.roda');
        const teclas = Object.create(null);
        const cameraAltura = 4;
        const aceleracao = 0.004;
        const frenagem = 0.006;
        const atrito = 0.002;
        const velocidadeMaxima = 0.35;
        const velocidadeRe = -0.08;
        const velocidadeRotacaoMin = 0.6;
        const velocidadeRotacaoMax = 2.2;
        let giroRodas = 0;
        let velocidadeAtual = 0;
        let anguloY = 0;
        const direcaoFrente = new THREE.Vector3();
        window.addEventListener('keydown', function (event) {
          teclas[event.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', function (event) {
          teclas[event.key.toLowerCase()] = false;
        });

        window.addEventListener('blur', function () {
          Object.keys(teclas).forEach(function (tecla) {
            teclas[tecla] = false;
          });
        });

        function animar() {
          const atual = carro.getAttribute('position');
          let x = atual.x;
          let z = atual.z;
          let moveu = false;

          if (teclas.w) {
            velocidadeAtual = Math.min(velocidadeAtual + aceleracao, velocidadeMaxima);
          } else if (teclas.s) {
            velocidadeAtual = Math.max(velocidadeAtual - frenagem, velocidadeRe);
          } else if (velocidadeAtual > 0) {
            velocidadeAtual = Math.max(velocidadeAtual - atrito, 0);
          } else if (velocidadeAtual < 0) {
            velocidadeAtual = Math.min(velocidadeAtual + atrito, 0);
          }

          if (Math.abs(velocidadeAtual) > 0.001) {
            const direcao = velocidadeAtual >= 0 ? 1 : -1;
            const intensidadeVelocidade = Math.min(
              Math.abs(velocidadeAtual) / velocidadeMaxima,
              1
            );
            const rotacaoAtual =
              velocidadeRotacaoMin +
              (velocidadeRotacaoMax - velocidadeRotacaoMin) * intensidadeVelocidade;

            if (teclas.a) {
              anguloY += rotacaoAtual * direcao;
            }

            if (teclas.d) {
              anguloY -= rotacaoAtual * direcao;
            }
          }

          carro.setAttribute('rotation', { x: 0, y: anguloY, z: 0 });

          if (Math.abs(velocidadeAtual) > 0.001) {
            carro.object3D.getWorldDirection(direcaoFrente);
            x += direcaoFrente.x * velocidadeAtual;
            z += direcaoFrente.z * velocidadeAtual;
            moveu = true;
          }

          carro.setAttribute('position', { x: x, y: atual.y, z: z });

          if (moveu) {
            giroRodas -= velocidadeAtual * 400;

            rodas.forEach(function (roda) {
              roda.object3D.rotation.x = THREE.MathUtils.degToRad(giroRodas);
            });
          }

          cameraRig.setAttribute('position', {
            x: x,
            y: atual.y + cameraAltura,
            z: z
          });
          cameraRig.setAttribute('rotation', {
            x: 0,
            y: anguloY,
            z: 0
          });

          requestAnimationFrame(animar);
        }

        animar();
      });
    </script>
  </body>
</html>
